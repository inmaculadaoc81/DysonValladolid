<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Equipos Acer sobre la mesa de trabajo del servicio técnico GlobalAcer">
  <defs>
    <linearGradient id="gaScreenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1667C9"/>
      <stop offset="1" stop-color="#0A2E5C"/>
    </linearGradient>
    <linearGradient id="gaChipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ED635"/>
      <stop offset="1" stop-color="#5C8A12"/>
    </linearGradient>
    <filter id="gaSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F4990" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- backdrop dotted orbit rings -->
  <circle cx="990" cy="190" r="150" fill="none" stroke="#DCE9F6" stroke-width="2" stroke-dasharray="4 8"/>
  <circle cx="990" cy="190" r="98" fill="none" stroke="#DCE9F6" stroke-width="2" stroke-dasharray="4 8"/>
  <circle cx="130" cy="600" r="110" fill="none" stroke="#E8F3D9" stroke-width="2" stroke-dasharray="4 8"/>

  <!-- desk -->
  <rect x="90" y="588" width="1020" height="24" rx="12" fill="#E4EEF7"/>
  <rect x="140" y="612" width="16" height="110" fill="#D7E3EE"/>
  <rect x="1040" y="612" width="16" height="110" fill="#D7E3EE"/>

  <!-- desktop tower -->
  <g filter="url(#gaSoft)">
    <rect x="170" y="360" width="140" height="228" rx="16" fill="#152233"/>
    <rect x="188" y="382" width="104" height="16" rx="4" fill="#1E3247"/>
    <circle cx="240" cy="562" r="12" fill="#9ED635"/>
    <rect x="188" y="416" width="104" height="10" rx="3" fill="#25405A"/>
    <rect x="188" y="436" width="104" height="10" rx="3" fill="#25405A"/>
    <rect x="188" y="456" width="60" height="10" rx="3" fill="#25405A"/>
  </g>

  <!-- laptop -->
  <g filter="url(#gaSoft)">
    <rect x="440" y="470" width="330" height="20" rx="6" fill="#DCE6EF"/>
    <path d="M430 470 L450 380 L760 380 L780 470 Z" fill="#F6FAFD" stroke="#DDE7F0" stroke-width="2"/>
    <rect x="460" y="150" width="300" height="222" rx="14" fill="#152233"/>
    <rect x="474" y="164" width="272" height="194" rx="4" fill="url(#gaScreenGrad)"/>
    <circle cx="610" cy="261" r="46" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="4"/>
    <path d="M610 215 v92 M564 261 h92" stroke="#ffffff" stroke-opacity=".35" stroke-width="3"/>
    <circle cx="642" cy="232" r="8" fill="#9ED635"/>
  </g>

  <!-- floating orbit nodes / network lines -->
  <g stroke="#B9CEE2" stroke-width="2" stroke-dasharray="3 6" fill="none">
    <path d="M770 220 Q 890 180 950 240"/>
    <path d="M340 320 Q 240 260 210 200"/>
  </g>
  <circle cx="950" cy="240" r="12" fill="#1667C9"/>
  <circle cx="210" cy="200" r="10" fill="#7CB818"/>
  <circle cx="1020" cy="310" r="8" fill="#9ED635"/>
  <circle cx="140" cy="270" r="7" fill="#1667C9"/>

  <!-- toolbox -->
  <g filter="url(#gaSoft)">
    <rect x="860" y="480" width="150" height="86" rx="14" fill="#FFFFFF" stroke="#DDE7F0" stroke-width="2"/>
    <rect x="860" y="480" width="150" height="30" rx="14" fill="url(#gaChipGrad)"/>
    <rect x="920" y="470" width="30" height="20" rx="4" fill="#5C8A12"/>
  </g>
  <g transform="translate(960,420) rotate(28)">
    <rect x="-6" y="-70" width="12" height="70" rx="6" fill="#0F4990"/>
    <rect x="-10" y="-86" width="20" height="20" rx="4" fill="#1667C9"/>
  </g>

  <!-- tablet leaning -->
  <g filter="url(#gaSoft)" transform="translate(340,470) rotate(-8)">
    <rect x="0" y="0" width="90" height="130" rx="12" fill="#FFFFFF" stroke="#DDE7F0" stroke-width="2"/>
    <rect x="10" y="12" width="70" height="96" rx="4" fill="url(#gaScreenGrad)"/>
    <circle cx="45" cy="118" r="4" fill="#9ED635"/>
  </g>
</svg>
